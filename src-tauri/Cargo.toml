[package]
name = "panto-srt"
version = "0.1.0"
description = "Private, offline subtitles from voice — transcription to SRT / FCPXML for DaVinci Resolve"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
